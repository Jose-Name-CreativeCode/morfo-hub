<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Morfo Hub | Tablero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-page-title="Tablero" data-nav-key="comercial" class="tb-page">
    <div class="app-layout">
      <aside class="sidebar" data-app-sidebar></aside>
      <div class="main-content">
        <header class="header" data-app-header></header>

        <main class="page-content tb-content">
          <section class="tb-state" aria-labelledby="tb-headline">
            <span class="tb-label" id="tb-period">&nbsp;</span>
            <h1 class="tb-headline" id="tb-headline">&nbsp;</h1>
            <div class="tb-figures">
              <div class="tb-figure is-in">
                <span>Cobrado</span>
                <strong id="tb-collected">$0</strong>
              </div>
              <div class="tb-figure is-out">
                <span>Gastado</span>
                <strong id="tb-spent">$0</strong>
              </div>
              <div class="tb-figure">
                <span>Embudo</span>
                <strong id="tb-pipeline">$0</strong>
              </div>
            </div>
          </section>

          <section class="tb-block" aria-labelledby="tb-rail-title">
            <div class="tb-head">
              <h2 id="tb-rail-title">Riel del mes</h2>
              <small id="tb-rail-range"></small>
            </div>
            <div class="tb-rail" id="tb-rail"></div>
            <p class="tb-note" id="tb-rail-note"></p>
          </section>

          <div class="tb-cols">
            <div class="tb-col">
              <section class="tb-block" aria-labelledby="tb-tasks-title">
                <div class="tb-head">
                  <h2 id="tb-tasks-title">Qué sigue</h2>
                  <small id="tb-tasks-count"></small>
                </div>
                <div class="tb-tasks" id="tb-tasks"></div>
                <p class="tb-note" id="tb-tasks-note"></p>
              </section>

              <section class="tb-block" aria-labelledby="tb-funnel-title">
                <div class="tb-head">
                  <h2 id="tb-funnel-title">Embudo</h2>
                  <small id="tb-funnel-count"></small>
                </div>
                <div class="tb-funnel" id="tb-funnel"></div>
                <div class="tb-deals" id="tb-deals"></div>
              </section>
            </div>

            <div class="tb-col">
              <section class="tb-block" aria-labelledby="tb-tax-title">
                <div class="tb-head">
                  <h2 id="tb-tax-title">Impuestos</h2>
                  <small id="tb-tax-month"></small>
                </div>
                <div class="tb-tax" id="tb-tax"></div>
                <p class="tb-note" id="tb-tax-note"></p>
                <a class="tb-link" href="dinero.html?scope=morfo"
                  >Ver el mes a detalle</a
                >
              </section>

              <section class="tb-block" aria-labelledby="tb-split-title">
                <div class="tb-head">
                  <h2 id="tb-split-title">Reparto</h2>
                  <small id="tb-split-month"></small>
                </div>
                <div class="tb-split" id="tb-split"></div>
                <div class="tb-split-legend" id="tb-split-legend"></div>
              </section>
            </div>
          </div>

          <div class="tb-dock">
            <a class="tb-dock-btn" href="income.html?scope=morfo">Cobro</a>
            <a class="tb-dock-btn is-main" href="quotes.html?scope=morfo"
              >Cotización</a
            >
          </div>
        </main>
      </div>
    </div>

    <div class="rs-backdrop" id="tb-backdrop" hidden></div>
    <div
      class="rs-sheet tb-sheet"
      id="tb-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tb-sheet-title"
      hidden
    >
      <div class="rs-grab"></div>
      <div class="rs-sheet-head">
        <div>
          <h3 id="tb-sheet-title"></h3>
          <small id="tb-sheet-meta"></small>
        </div>
        <button
          type="button"
          class="rs-icon-btn"
          id="tb-sheet-close"
          aria-label="Cerrar"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <strong class="rs-detail-amount" id="tb-sheet-amount"></strong>
      <dl class="rs-detail-list" id="tb-sheet-list"></dl>
      <div class="tb-stage-picker" id="tb-stage-picker"></div>
      <a
        class="tb-dock-btn is-main"
        id="tb-sheet-open"
        href="quotes.html?scope=morfo"
      >
        Abrir cotización y PDF
      </a>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/modules/comercial.js"></script>
  </body>
</html>
