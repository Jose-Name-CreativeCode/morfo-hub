<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morfo Hub | Gastos</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-page-title="Gastos" data-nav-key="expenses">
    <div class="app-layout">
      <aside class="sidebar" data-app-sidebar></aside>

      <div class="main-content">
        <header class="header" data-app-header></header>

        <main class="page-content">
          <h1 class="section-title">Registro de gastos</h1>
          <p class="section-subtitle">
            Administra los gastos operativos de Morfo, su categoría, método de
            pago y observaciones.
          </p>

          <section class="card section-spacing">
            <h2 class="section-title section-title-sm">Nuevo gasto</h2>

            <form>
              <div class="form-group">
                <label for="expense-date">Fecha</label>
                <input type="date" id="expense-date" />
              </div>

              <div class="form-group">
                <label for="expense-concept">Concepto</label>
                <input
                  type="text"
                  id="expense-concept"
                  placeholder="Ej. Publicidad Meta Ads"
                />
              </div>

              <div class="form-group">
                <label for="expense-category">Categoría</label>
                <select id="expense-category">
                  <option value="">Selecciona una categoría</option>
                  <option value="Publicidad">Publicidad</option>
                  <option value="Software / Herramientas">
                    Software / Herramientas
                  </option>
                  <option value="Transporte">Transporte</option>
                  <option value="Comidas / Reuniones">
                    Comidas / Reuniones
                  </option>
                  <option value="Equipo">Equipo</option>
                  <option value="Hosting / Dominio">Hosting / Dominio</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>

              <div class="form-group">
                <label for="expense-amount">Monto</label>
                <input
                  type="number"
                  id="expense-amount"
                  placeholder="0.00"
                  step="0.01"
                />
              </div>

              <div class="form-group">
                <label for="expense-payment-method">Método de pago</label>
                <select id="expense-payment-method">
                  <option value="">Selecciona una opción</option>
                  <option value="Efectivo">Efectivo</option>
                  <option value="Tarjeta">Tarjeta</option>
                  <option value="Transferencia">Transferencia</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>

              <div class="form-group">
                <label for="expense-invoice">¿Tiene factura?</label>
                <select id="expense-invoice">
                  <option value="">Selecciona una opción</option>
                  <option value="yes">Sí</option>
                  <option value="no">No</option>
                </select>
              </div>

              <div class="form-group">
                <label for="expense-notes">Observaciones</label>
                <textarea
                  id="expense-notes"
                  rows="4"
                  placeholder="Notas adicionales del gasto..."
                ></textarea>
              </div>

              <button type="submit" class="btn-primary">Guardar gasto</button>
            </form>
          </section>

          <section class="card section-spacing">
            <h2 class="section-title section-title-sm">Filtros</h2>

            <div class="filters-grid">
              <div class="form-group form-group-tight">
                <label for="filter-expense-year">Año</label>
                <select id="filter-expense-year">
                  <option value="">Todos</option>
                </select>
              </div>

              <div class="form-group form-group-tight">
                <label for="filter-expense-month">Mes</label>
                <select id="filter-expense-month">
                  <option value="">Todos</option>
                  <option value="01">Enero</option>
                  <option value="02">Febrero</option>
                  <option value="03">Marzo</option>
                  <option value="04">Abril</option>
                  <option value="05">Mayo</option>
                  <option value="06">Junio</option>
                  <option value="07">Julio</option>
                  <option value="08">Agosto</option>
                  <option value="09">Septiembre</option>
                  <option value="10">Octubre</option>
                  <option value="11">Noviembre</option>
                  <option value="12">Diciembre</option>
                </select>
              </div>

              <div class="form-group form-group-tight">
                <button
                  type="button"
                  class="btn-primary"
                  id="clear-expense-filters"
                >
                  Limpiar filtros
                </button>
              </div>

              <div class="form-group form-group-tight">
                <button
                  type="button"
                  class="btn-primary"
                  id="export-expense-excel"
                >
                  Descargar Excel
                </button>
              </div>
            </div>
          </section>

          <section class="table-wrapper">
            <table class="table">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Concepto</th>
                  <th>Categoría</th>
                  <th>Monto</th>
                  <th>Método de pago</th>
                  <th>Factura</th>
                  <th>Editar</th>
                  <th>Eliminar</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </section>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/modules/expenses.js"></script>
  </body>
</html>
