<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morfo Hub | Ingresos</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-page-title="Ingresos" data-nav-key="income">
    <div class="app-layout">
      <aside class="sidebar" data-app-sidebar></aside>

      <div class="main-content">
        <header class="header" data-app-header></header>

        <main class="page-content">
          <h1 class="section-title">Registro de ingresos</h1>
          <p class="section-subtitle">
            Administra los ingresos recibidos, pagos parciales y estatus de
            cobro por cliente.
          </p>

          <section class="card section-spacing">
            <h2 class="section-title section-title-sm">Nuevo ingreso</h2>

            <form>
              <div class="form-group">
                <label for="income-client">Cliente</label>
                <select id="income-client">
                  <option value="">Selecciona un cliente</option>
                </select>
              </div>

              <div class="form-group">
                <label for="income-date">Fecha</label>
                <input type="date" id="income-date" />
              </div>

              <div class="form-group">
                <label for="income-concept">Concepto</label>
                <input
                  type="text"
                  id="income-concept"
                  placeholder="Ej. Plan mensual de redes sociales"
                />
              </div>

              <div class="form-group">
                <label for="income-amount">Monto total</label>
                <input
                  type="number"
                  id="income-amount"
                  placeholder="0.00"
                  step="0.01"
                />
              </div>

              <div class="form-group">
                <label for="income-payment-status">Estatus de pago</label>
                <select id="income-payment-status">
                  <option value="">Selecciona una opción</option>
                  <option value="Pendiente">Pendiente</option>
                  <option value="Pago parcial">Pago parcial</option>
                  <option value="Pagado">Pagado</option>
                </select>
              </div>

              <div class="form-group">
                <label for="income-paid-amount">Monto pagado</label>
                <input
                  type="number"
                  id="income-paid-amount"
                  placeholder="0.00"
                  step="0.01"
                />
              </div>

              <div class="form-group">
                <label for="income-payment-method">Método de pago</label>
                <select id="income-payment-method">
                  <option value="">Selecciona una opción</option>
                  <option value="Transferencia">Transferencia</option>
                  <option value="Efectivo">Efectivo</option>
                  <option value="Tarjeta">Tarjeta</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>

              <div class="form-group">
                <label for="income-invoice">¿Requiere factura?</label>
                <select id="income-invoice">
                  <option value="">Selecciona una opción</option>
                  <option value="yes">Sí</option>
                  <option value="no">No</option>
                </select>
              </div>

              <div class="form-group">
                <label for="income-notes">Observaciones</label>
                <textarea
                  id="income-notes"
                  rows="4"
                  placeholder="Notas del ingreso o condiciones del pago..."
                ></textarea>
              </div>

              <button type="submit" class="btn-primary">Guardar ingreso</button>
            </form>
          </section>

          <section class="card section-spacing">
            <h2 class="section-title section-title-sm">Filtros</h2>

            <div class="filters-grid">
              <div class="form-group form-group-tight">
                <label for="filter-income-year">Año</label>
                <select id="filter-income-year">
                  <option value="">Todos</option>
                </select>
              </div>

              <div class="form-group form-group-tight">
                <label for="filter-income-month">Mes</label>
                <select id="filter-income-month">
                  <option value="">Todos</option>
                  <option value="01">Enero</option>
                  <option value="02">Febrero</option>
                  <option value="03">Marzo</option>
                  <option value="04">Abril</option>
                  <option value="05">Mayo</option>
                  <option value="06">Junio</option>
                  <option value="07">Julio</option>
                  <option value="08">Agosto</option>
                  <option value="09">Septiembre</option>
                  <option value="10">Octubre</option>
                  <option value="11">Noviembre</option>
                  <option value="12">Diciembre</option>
                </select>
              </div>

              <div class="form-group form-group-tight">
                <button
                  type="button"
                  class="btn-primary"
                  id="clear-income-filters"
                >
                  Limpiar filtros
                </button>
              </div>

              <div class="form-group form-group-tight">
                <button
                  type="button"
                  class="btn-primary"
                  id="export-income-excel"
                >
                  Descargar Excel
                </button>
              </div>
            </div>
          </section>
          <section class="table-wrapper">
            <table class="table">
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Fecha</th>
                  <th>Concepto</th>
                  <th>Monto total</th>
                  <th>Pagado</th>
                  <th>Estatus</th>
                  <th>Factura</th>
                  <th>Editar</th>
                  <th>Eliminar</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/modules/income.js"></script>
  </body>
</html>
